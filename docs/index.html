<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="__SITE_TITLE__">
<title>__SITE_TITLE__</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="lock" class="lock" hidden>
  <div class="lock-card">
    <div class="lock-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
    </div>
    <h1 class="lock-title">__SITE_TITLE__</h1>
    <p class="lock-sub">Enter the password once. This phone will remember it.</p>
    <form id="lockForm" autocomplete="on">
      <label class="sr-only" for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button id="unlockBtn" type="submit" class="btn-primary">Unlock</button>
    </form>
    <p id="lockMsg" class="lock-msg" role="alert"></p>
    <p class="lock-foot">Don't have the password? Ask the office.</p>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div class="titles">
          <h1 class="app-title">__SITE_TITLE__</h1>
          <p id="updated" class="updated"></p>
        </div>
        <button id="lockBtn" class="icon-btn" type="button" aria-label="Lock this phone" title="Lock this phone">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="q">Search</label>
          <input id="q" type="search" placeholder="Part no. or name" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
          <button id="clearQ" class="clear" type="button" aria-label="Clear search" hidden>&times;</button>
        </div>
        <label class="sr-only" for="brand">Brand</label>
        <select id="brand"></select>
      </div>
      <div class="sub-row">
        <p id="count" class="count"></p>
        <p id="offline" class="offline" hidden>Offline: saved prices</p>
      </div>
    </div>
  </header>

  <section class="wrap">
    <div id="list" class="list"></div>
    <div id="more" class="more" aria-hidden="true"></div>
    <p id="empty" class="empty" hidden>No part matches. Check the part number, or try fewer letters.</p>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Please open this link in Chrome or Safari with JavaScript switched on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
