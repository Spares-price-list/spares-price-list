name: Price Robot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      allow_big_drop:
        description: "Allow a big drop in parts (only if you removed parts on purpose)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: price-robot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install robot tools
        run: pip install --quiet -r robot/requirements.txt

      - name: Find the site address
        id: pages
        uses: actions/configure-pages@v5

      - name: Read sheet, keep selling prices, encrypt
        id: build
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_SALT: ${{ secrets.SITE_SALT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' }}
          ALLOW_BIG_DROP: ${{ github.event.inputs.allow_big_drop == 'true' }}
        run: python robot/sync.py --out _site

      - name: Package the site
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Keep the 30-minute schedule switched on
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/price-robot.yml/enable" --silent

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
